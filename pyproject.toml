[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "kyvern"
version     = "0.5.0"
description = "Decision provenance and accountability infrastructure for autonomous systems"
readme      = "README.md"
license     = { text = "Apache-2.0" }
authors     = [{ name = "Emre Altunbulak" }]
requires-python = ">=3.10"
# Core: what the decision pipeline, the audit chain and the CLIs import.
# Lower bounds only, so installing Kyvern never downgrades your packages.
dependencies = [
    "cryptography>=43",          # Ed25519 signing; rfc3161-client needs >=43
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "filelock>=3.12",            # inter-process lock for appending to the audit chain
    "rfc3161-client>=1.0.9",     # RFC 3161 anchoring; <1.0.3 had CVE-2025-52556
    "certifi",                   # trusted roots for verifying TSA timestamps
    "reportlab>=4.0",            # kyvern-report PDF
    "httpx>=0.27,<1",            # LLM client
]

[project.scripts]
kyvern-verify = "cli.kyvern_verify:main"
kyvern-report = "cli.kyvern_report:main"
kyvern-mcp = "kyvern.mcp.server:run"
kyvern-anchor = "cli.kyvern_anchor:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["services*", "kyvern*", "shared*", "cli*"]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/altunbulakemre75/kyvern"
Documentation = "https://altunbulakemre75.github.io/kyvern/"
Changelog     = "https://github.com/altunbulakemre75/kyvern/blob/main/CHANGELOG.md"
Issues        = "https://github.com/altunbulakemre75/kyvern/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.400",
    "pypdf>=4.0.0",   # PDF assertions in the report tests
]

llm = [
    # Activate with: pip install -e ".[llm]"
    # Required when KYVERN_DECISION_LLM_ENABLED=true
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
]

mcp = [
    # Activate with: pip install -e ".[mcp]"
    # Required to run the kyvern-mcp stdio audit-query server.
    # mcp 2.x renamed FastMCP to MCPServer; kyvern-mcp is written against 1.x
    # and tested with 1.12 and 1.27.
    "mcp>=1.12,<2",
]

docs = [
    # Activate with: pip install -e ".[docs]"
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT"]
ignore = ["E501"]

# ── Pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
include          = ["kyvern", "cli", "services", "shared"]
pythonVersion    = "3.10"
typeCheckingMode = "standard"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short"
markers      = ["integration: tests requiring external services or env-var gates"]
