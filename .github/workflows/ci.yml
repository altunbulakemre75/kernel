name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,fusion,llm,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v --tb=short

  core-install:
    name: Core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core only
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install .

      - name: Smoke test from outside the checkout
        working-directory: /tmp
        run: /tmp/core/bin/python "$GITHUB_WORKSPACE/scripts/smoke_core_install.py"

  tests-without-extras:
    name: Tests with only the dev extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Own cache key: with the default (requirements.txt) this job would
          # share the full-extras 3.12 job's key and could fill it dev-only.
          cache-dependency-path: pyproject.toml

      - name: Install the core and dev tooling
        run: pip install -e ".[dev]"

      - name: Test (pytest) — fusion and MCP tests skip themselves
        run: pytest tests/ -rfEs --tb=short
