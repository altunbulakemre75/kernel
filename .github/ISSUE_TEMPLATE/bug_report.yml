name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a changed, deleted or forged record passes `kyvern-verify`, please report it
        privately instead (Security → Report a vulnerability); see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you saw. Paste the command and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps, or a small chain file without sensitive data.
  - type: input
    id: version
    attributes:
      label: Kyvern version or commit
      description: "`pip show kyvern`, or `git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, extras installed (mcp, llm), ROS2 distribution if relevant
